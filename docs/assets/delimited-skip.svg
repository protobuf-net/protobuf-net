<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Skipping an unwanted field: the cost of no length prefix">
<rect width="720" height="336" fill="#ffffff"/>
<text x="16" y="28" font-size="16" font-weight="600" fill="#1f2328">Skipping an unwanted field: the cost of no length prefix</text>
<text x="16" y="48" font-size="12" fill="#59636e">protobuf-net v4, deep chain, reading into a contract that ignores the sub-message</text>
<rect x="150" y="74" width="9.9" height="22" fill="#6e7781" rx="2"/>
<text x="142" y="90" font-size="12" fill="#1f2328" text-anchor="end">length-prefixed</text>
<text x="167.9" y="90" font-size="12" fill="#59636e">132 ns</text>
<rect x="150" y="104" width="14.9" height="22" fill="#1f6feb" rx="2"/>
<text x="142" y="120" font-size="12" fill="#1f2328" text-anchor="end">delimited</text>
<text x="172.9" y="120" font-size="12" fill="#59636e">198 ns</text>
<text x="8" y="100" font-size="11" font-weight="600" fill="#59636e">depth 8</text>
<line x1="150" y1="68" x2="670" y2="68" stroke="#d1d9e0" stroke-width="1"/>
<rect x="150" y="152" width="8.1" height="22" fill="#6e7781" rx="2"/>
<text x="142" y="168" font-size="12" fill="#1f2328" text-anchor="end">length-prefixed</text>
<text x="166.1" y="168" font-size="12" fill="#59636e">107 ns</text>
<rect x="150" y="182" width="65.6" height="22" fill="#1f6feb" rx="2"/>
<text x="142" y="198" font-size="12" fill="#1f2328" text-anchor="end">delimited</text>
<text x="223.6" y="198" font-size="12" fill="#59636e">871 ns</text>
<text x="8" y="178" font-size="11" font-weight="600" fill="#59636e">depth 64</text>
<line x1="150" y1="146" x2="670" y2="146" stroke="#d1d9e0" stroke-width="1"/>
<rect x="150" y="230" width="7.2" height="22" fill="#6e7781" rx="2"/>
<text x="142" y="246" font-size="12" fill="#1f2328" text-anchor="end">length-prefixed</text>
<text x="165.2" y="246" font-size="12" fill="#59636e">96 ns</text>
<rect x="150" y="260" width="480.0" height="22" fill="#1f6feb" rx="2"/>
<text x="142" y="276" font-size="12" fill="#1f2328" text-anchor="end">delimited</text>
<text x="638.0" y="276" font-size="12" fill="#59636e">6,377 ns</text>
<text x="8" y="256" font-size="11" font-weight="600" fill="#59636e">depth 512</text>
<line x1="150" y1="224" x2="670" y2="224" stroke="#d1d9e0" stroke-width="1"/>
<text x="16" y="322" font-size="11" fill="#59636e">A length lets the reader jump the whole field; a delimited body must be walked to its end tag.</text>
</svg>