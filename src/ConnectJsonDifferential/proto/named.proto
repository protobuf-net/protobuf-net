// Schemas whose shape is NOT the obvious reading of the C#: the four places a field name can come
// from, and a surrogated type whose wire form is another type's entirely. Not hand-written - the
// `Serializer.GetProto<T>()` outputs concatenated, with only the package and a csharp_namespace
// changed. Regenerate with DUMP_NAMED=1; SchemaMatchesContracts() re-derives and compares every run.
syntax = "proto3";
package namedoracle;
option csharp_namespace = "NamedOracle";

message Named {
   string by_proto_member = 1;
   string TagPinnedSoNameIgnored = 2;
   string proto_member_wins = 3;
   string by_partial = 4;
}
message NamedByContract {
   string renamed_by_data_member = 1;
   string Plain = 2;
}
message NamedByXml {
   string renamed_by_xml = 1;
   string Plain = 2;
}
enum Currency {
   Unknown = 0;
   Gbp = 1;
   Usd = 2;
}
message HasSurrogate {
   MoneySurrogate Price = 1;
}
message MoneySurrogate {
   int64 Units = 1;
   Currency Currency = 2;
}
