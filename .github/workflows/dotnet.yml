# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main", "v4" ]
  # deliberately NOT filtered by branch: the filter matches the PR's BASE, so any PR
  # targeting a branch missing from the list gets zero checks - and a PR with no checks
  # looks clean rather than broken, which is the wrong failure mode. Every PR is a
  # proposal to merge somewhere, so every PR gets built. The push filter above stays,
  # since that one genuinely stops each topic-branch push burning a Windows runner.
  pull_request:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch the full history (for versioning)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    # Restore dominates the cold-runner build time, and the package set changes rarely; the
    # same treatment measurably helped SE.Redis (StackExchange/StackExchange.Redis@74bfe78).
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('src/Directory.Packages.props', 'global.json', '**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-
    - name: Restore dependencies
      run: dotnet restore Build.csproj
    - name: Build
      run: dotnet build Build.csproj --no-restore
    - name: Test
      run: dotnet test Build.csproj --no-build --verbosity normal
    # Runs the AOT generator over every [ProtoContract] in the already-built test assemblies and
    # compares its bytes against RuntimeTypeModel's. Exits non-zero only on a *byte mismatch*, which
    # is a generator bug by construction - the same instance serialized two ways, disagreeing on the
    # wire. Worth a CI step because that class of bug compiles cleanly and passes every other test
    # here; several shipped for months before this existed. Needs no extra build: the traversal
    # project above already produces the assemblies it scans.
    - name: AOT differential
      run: dotnet run --project src/AotDifferential/AotDifferential.csproj --no-build
    # The descriptor model (protobuf-net.Reflection's CustomProtogenSerializer) is generator
    # output committed to the tree, because BuildTools compiles Reflection's SOURCES in and needs
    # both halves of the partial on disk. The build above regenerated it; a diff here means the
    # committed copy has drifted from what the generator now produces - commit the regeneration.
    - name: Generated model drift
      run: git diff --exit-code -- src/protobuf-net.Reflection/Generated
    # The same idea applied to gRPC endpoint metadata: reconstructs each endpoint's metadata from
    # symbols, compiles and *runs* it, and compares the resulting objects against what
    # ServiceBinder.GetMetadata produces reflectively. Gated because the failure mode is silent and
    # security-relevant - a dropped [Authorize] is a more permissive endpoint, with no error anywhere.
    # A difference against the pinned package is reported rather than failed where a released
    # protobuf-net.Grpc is known to differ; anything else exits non-zero.
    - name: gRPC endpoint-metadata differential
      run: dotnet run --project src/AotGrpcMetadataDiff/AotGrpcMetadataDiff.csproj --no-build

  # The only leg that proves the AOT story on a second platform. Deliberately NOT the traversal:
  # Build.csproj globs src\*\*.csproj, which includes net4x-only projects, and that is exactly why the
  # job above is windows-latest. These two are net8.0 apps, and although protobuf-net multi-targets down
  # to net462, a net8.0 consumer resolves only the net8.0 TFM - so net4x is never built here.
  #
  # It *runs* the published binaries rather than only publishing them: both exit non-zero on mismatch,
  # and under a native publish the reflective fallbacks are simply absent, so a pass here means the
  # generated path carried the whole thing. Publishing alone would prove it links, which is not the claim.
  #
  # Gated on exit code only, never on the IL warning count: that count tracks the fixtures, so pinning it
  # would turn every legitimate fixture change into a CI failure. It is a measurement to re-take, not a
  # threshold - see notes/aot/findings.md.
  native-aot-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # versioning
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('src/Directory.Packages.props', 'global.json', '**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-
    # ILC shells out to the platform toolchain to link; clang is on the image, zlib is not always
    - name: Install the native toolchain
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    # -o rather than the default path: these two are on different TFMs (net10.0 and net8.0) and would
    # move again, so naming bin/Release/<tfm>/... here is a break waiting to happen
    - name: Publish and run the serializer smoke test
      run: |
        dotnet publish src/AotSmoke/AotSmoke.csproj -c Release -r linux-x64 -o artifacts/aot-smoke
        ./artifacts/aot-smoke/AotSmoke
    - name: Publish and run the gRPC smoke test
      run: |
        dotnet publish src/AotGrpcSmoke/AotGrpcSmoke.csproj -c Release -r linux-x64 -o artifacts/aot-grpc-smoke
        ./artifacts/aot-grpc-smoke/AotGrpcSmoke
