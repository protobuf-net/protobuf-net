# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main", "v4" ]
  # deliberately NOT filtered by branch: the filter matches the PR's BASE, so any PR
  # targeting a branch missing from the list gets zero checks - and a PR with no checks
  # looks clean rather than broken, which is the wrong failure mode. Every PR is a
  # proposal to merge somewhere, so every PR gets built. The push filter above stays,
  # since that one genuinely stops each topic-branch push burning a Windows runner.
  pull_request:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch the full history (for versioning)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    # Restore dominates the cold-runner build time, and the package set changes rarely; the
    # same treatment measurably helped SE.Redis (StackExchange/StackExchange.Redis@74bfe78).
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('src/Directory.Packages.props', 'global.json', '**/*.csproj') }}
        restore-keys: ${{ runner.os }}-nuget-
    - name: Restore dependencies
      run: dotnet restore Build.csproj
    - name: Build
      run: dotnet build Build.csproj --no-restore
    - name: Test
      run: dotnet test Build.csproj --no-build --verbosity normal
    # Runs the AOT generator over every [ProtoContract] in the already-built test assemblies and
    # compares its bytes against RuntimeTypeModel's. Exits non-zero only on a *byte mismatch*, which
    # is a generator bug by construction - the same instance serialized two ways, disagreeing on the
    # wire. Worth a CI step because that class of bug compiles cleanly and passes every other test
    # here; several shipped for months before this existed. Needs no extra build: the traversal
    # project above already produces the assemblies it scans.
    - name: AOT differential
      run: dotnet run --project src/AotDifferential/AotDifferential.csproj --no-build
    # The descriptor model (protobuf-net.Reflection's CustomProtogenSerializer) is generator
    # output committed to the tree, because BuildTools compiles Reflection's SOURCES in and needs
    # both halves of the partial on disk. The build above regenerated it; a diff here means the
    # committed copy has drifted from what the generator now produces - commit the regeneration.
    - name: Generated model drift
      run: git diff --exit-code -- src/protobuf-net.Reflection/Generated
