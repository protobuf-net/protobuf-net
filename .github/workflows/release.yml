# Publishes to nuget.org when a GitHub Release is published.
#
# Auth is NuGet Trusted Publishing (OIDC): no long-lived API key is stored anywhere.
# The one-time setup on nuget.org is: username menu -> Trusted Publishing -> add policy with
#   Repository Owner: protobuf-net / Repository: protobuf-net / Workflow File: release.yml
#   Environment: release
# plus a NUGET_USER repository secret holding the nuget.org profile name to publish as.
#
# Versioning note: Nerdbank.GitVersioning computes the version from src/version.json plus commit
# height - the tag name does not set it. Create release tags with `nbgv tag` (or tag the commit
# whose computed version matches); the guard step below fails the run on any mismatch rather than
# publishing a package that disagrees with its release.
#
# CUTTING A RELEASE (verified 2026-08-26, on v4 / 4.0-alpha):
#
#   1. optional but worth it the first time on a new line: run this workflow via
#      workflow_dispatch. That builds, tests, runs the AOT differential, packs, and uploads the
#      .nupkg files as a run artifact - and CANNOT reach nuget.org, since the login and push steps
#      are gated on github.event_name == 'release'. Inspect the packages before cutting anything.
#   2. on an up-to-date release branch, run ./get-version.ps1 (or .sh). It prints the exact tag
#      string, which is NuGetPackageVersion - the same variable the guard below compares against.
#      It refuses to hand out a tag off a release branch, because nbgv appends a commit id there.
#   3. tag THAT COMMIT with THAT STRING and push the tag. `nbgv tag` produces the identical string
#      (checked with `nbgv tag --what-if`, which includes the prerelease label), so either it or a
#      plain `git tag` works. Tags here are bare - 3.3.21, 3.4.19 - and the guard strips a leading
#      `v`, so both spellings pass.
#   4. draft a GitHub Release against that EXISTING tag and publish it. Tick "Set as a pre-release"
#      whenever the version carries a label; get-version says so when it does.
#
# Step 3 before step 4 is deliberate. The Release UI can create the tag for you by targeting a
# branch, but it then tags whatever the tip is at publish time - so anything pushed since you ran
# get-version shifts the height and the guard fails. (Which is the intended failure: it is loud.)

# Actions are pinned by commit SHA rather than by tag. A tag is mutable: whoever controls the
# action repository can repoint v4 at different code, and this workflow holds id-token: write and
# publishes to nuget.org, so that is where it genuinely matters. The trailing comment records
# which release the SHA is, and Dependabot moves both together.
name: Release

on:
  release:
    types: [published]
  # dry run: everything except the tag check and the push, so the pipeline can be
  # proven (and the packages inspected, via the run artifact) without cutting a release
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write # for the OIDC exchange with nuget.org
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Fetch the full history (for versioning)
    # 11.0.x is required by the test step: global.json selects the Microsoft.Testing.Platform
    # runner, and `dotnet test` can only see a traversal project on the .NET 11 SDK
    # (dotnet/sdk#55297). The bare channel is deliberate - it resolves to whatever is newest there,
    # so this becomes GA with no edit. Do NOT add `dotnet-quality: preview`, which pins to the last
    # preview forever: measured, `--channel 10.0 --quality preview` still resolves to 10.0.100-rc.2
    # months after 10.0 shipped.
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x
          11.0.x
    - name: Verify tag matches computed version
      if: github.event_name == 'release'
      shell: pwsh
      run: |
        dotnet tool install --global nbgv
        $computed = nbgv get-version --project src --variable NuGetPackageVersion
        $tag = "${{ github.event.release.tag_name }}" -replace '^v', ''
        if ($computed -ne $tag) {
          Write-Error "Tag '$tag' does not match the computed version '$computed'; tag with 'nbgv tag' so the two agree."
          exit 1
        }
        Write-Output "Publishing $computed"
    - name: Restore dependencies
      run: dotnet restore Build.csproj
    - name: Build
      run: dotnet build Build.csproj --no-restore -c Release /p:CI=true
    - name: Test
      run: dotnet test Build.csproj --no-build -c Release /p:CI=true --verbosity normal
    # Same byte-for-byte gate as CI: a generator bug that compiles cleanly must not ship.
    - name: AOT differential
      run: dotnet run --project src/AotDifferential/AotDifferential.csproj --no-build -c Release
    # Packing=true restricts the traversal to the shippable projects (see Build.csproj)
    - name: Pack
      run: dotnet pack Build.csproj --no-build -c Release /p:Packing=true /p:CI=true /p:PackageOutputPath=${{ github.workspace }}\.nupkgs
    # The packages survive as a run artifact even if the push fails
    - name: Upload packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: packages
        path: .nupkgs/*.nupkg
    - name: NuGet login (OIDC to temp API key)
      if: github.event_name == 'release'
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to nuget.org
      if: github.event_name == 'release'
      run: dotnet nuget push .nupkgs\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
